<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530">
<rect width="100%" height="100%" fill="white"/>
<g font-family="Literata, DejaVu Sans, serif" fill="#172033">
<text x="550.00" y="38.00" text-anchor="middle" font-size="27" fill="#172033">Розмах, квартилі та медіана вибірки</text>
<line x1="120.00" y1="220.00" x2="980.00" y2="220.00" stroke="#475569" stroke-width="4"/>
<line x1="120.00" y1="185.00" x2="120.00" y2="255.00" stroke="#475569" stroke-width="4"/>
<line x1="980.00" y1="185.00" x2="980.00" y2="255.00" stroke="#475569" stroke-width="4"/>
<rect x="335.00" y="160" width="430.00" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<line x1="550.00" y1="160.00" x2="550.00" y2="280.00" stroke="#e11d48" stroke-width="5"/>
<text x="120.00" y="120.00" text-anchor="middle" font-size="22" fill="#172033">мінімум = 1</text>
<text x="335.00" y="315.00" text-anchor="middle" font-size="22" fill="#172033">Q₁ = 2</text>
<text x="550.00" y="120.00" text-anchor="middle" font-size="22" fill="#172033">медіана = 3</text>
<text x="765.00" y="315.00" text-anchor="middle" font-size="22" fill="#172033">Q₃ = 4</text>
<text x="980.00" y="120.00" text-anchor="middle" font-size="22" fill="#172033">максимум = 5</text>
<text x="100.00" y="395.00" text-anchor="start" font-size="23" fill="#172033">IQR = 2; межі 1,5·IQR: [-1; 7].</text>
<text x="100.00" y="445.00" text-anchor="start" font-size="21" fill="#172033">Квартилі: лінійна інтерполяція за позицією (n−1)·p, method=&quot;inclusive&quot;.</text>
<text x="100.00" y="490.00" text-anchor="start" font-size="21" fill="#172033">Вуса — крайні спостереження в межах 1,5·IQR; точки — значення поза ними.</text>
</g></svg>