<text x="100" y="340" font-size="16" fill="#17212b" text-anchor="end" font-weight="normal">max стовпця</text>
<text x="172.5" y="340" font-size="21" fill="#64748b" text-anchor="middle" font-weight="normal">5</text>
<text x="277.5" y="340" font-size="21" fill="#64748b" text-anchor="middle" font-weight="normal">4</text>
<text x="382.5" y="340" font-size="21" fill="#177245" text-anchor="middle" font-weight="bold">3</text>
<text x="25" y="387" font-size="21" fill="#17212b" text-anchor="start" font-weight="bold">α = -1; β = 3; чистої рівноваги немає</text>
<text x="25" y="416" font-size="15" fill="#64748b" text-anchor="start" font-weight="normal">Помаранчева рамка — сідлова точка; зелений текст — оптимальна гранична оцінка.</text>
<text x="25" y="450" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">A1: Словникове стиснення</text>
<text x="485" y="450" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">B1: Повторювані журнали</text>
<text x="25" y="477" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">A2: Статистичне стиснення</text>
<text x="485" y="477" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">B2: Короткі структуровані записи</text>
<text x="25" y="504" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">A3: Блокове стиснення</text>
<text x="485" y="504" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">B3: Двійкові потоки</text>
