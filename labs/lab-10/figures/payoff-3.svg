<text x="25" y="35" font-size="22" fill="#17212b" text-anchor="start" font-weight="bold">Змагання алгоритмів стиснення</text>
<text x="25" y="62" font-size="16" fill="#17212b" text-anchor="start" font-weight="normal">Платежі першому гравцеві: рядки — його стратегії, стовпці — стратегії другого.</text>
<text x="172.5" y="95" font-size="19" fill="#17212b" text-anchor="middle" font-weight="bold">B1</text>
