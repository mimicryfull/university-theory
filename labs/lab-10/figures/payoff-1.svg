<text x="25" y="323" font-size="21" fill="#17212b" text-anchor="start" font-weight="bold">α = -1; β = 1; чистої рівноваги немає</text>
<text x="25" y="352" font-size="15" fill="#64748b" text-anchor="start" font-weight="normal">Помаранчева рамка — сідлова точка; зелений текст — оптимальна гранична оцінка.</text>
<text x="25" y="386" font-size="15" fill="#17212b" text-anchor="start" font-weight="normal">A1: Герб</text>
